<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shiksha Mitra Student Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">
        Shiksha Mitra Student Portal
      </h1>

      <!-- Searchable Shiksha Mitra Selection -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2"
          >Select or Search Shiksha Mitra</label
        >
        <input
          list="shiksha-mitras-list"
          id="mitra-search"
          placeholder="Type or select name..."
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
        <datalist id="shiksha-mitras-list"></datalist>
      </div>

      <!-- Grades 3 to 8 Container -->
      <div id="grades-container" class="space-y-6 hidden">
        <!-- Dynamic lists for grades 3-8 will be injected here -->
      </div>

      <!-- Submit Button -->
      <div class="mt-8 flex justify-end">
        <button
          id="submit-btn"
          disabled
          class="px-6 py-2.5 bg-blue-600 text-white font-medium rounded-lg shadow disabled:bg-gray-300 disabled:cursor-not-allowed hover:bg-blue-700 transition"
        >
          Save Genders
        </button>
      </div>
    </div>

    <script>
      // Initialize Supabase client using a non-conflicting variable name
      const SUPABASE_URL = "https://gmkhwnjzghfvwidukntv.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_qlr-Io8tawd5q6RTYBIF9A_nMIvcK4P";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      let allStudents = [];
      let selectedMitra = "";

      async function init() {
        await fetchAllStudents();
      }

      // Fetch all students in chunks of 1,000 to bypass Supabase's default row limit
      async function fetchAllStudents() {
        let allData = [];
        let page = 0;
        const pageSize = 1000;
        let fetching = true;

        console.log("Fetching all student records from Supabase...");

        while (fetching) {
          const from = page * pageSize;
          const to = from + pageSize - 1;

          const { data, error } = await supabaseClient
            .from("students")
            .select("*")
            .range(from, to);

          if (error) {
            console.error("Error fetching students:", error);
            break;
          }

          if (data && data.length > 0) {
            allData = allData.concat(data);
            if (data.length < pageSize) {
              fetching = false; // Reached the end of the table
            } else {
              page++;
            }
          } else {
            fetching = false;
          }
        }

        allStudents = allData;
        console.log(
          `Successfully loaded ${allStudents.length} total students.`,
        );
        populateMitraDropdown();
      }

      function populateMitraDropdown() {
        const mitras = [
          ...new Set(allStudents.map((s) => s.shiksha_mitra_name)),
        ]
          .filter(Boolean)
          .sort();
        const datalist = document.getElementById("shiksha-mitras-list");
        datalist.innerHTML = mitras
          .map((m) => `<option value="${m}">`)
          .join("");
      }

      const mitraInput = document.getElementById("mitra-search");
      mitraInput.addEventListener("input", (e) => {
        selectedMitra = e.target.value.trim();
        const container = document.getElementById("grades-container");

        const validMitras = [
          ...new Set(allStudents.map((s) => s.shiksha_mitra_name)),
        ];
        if (selectedMitra && validMitras.includes(selectedMitra)) {
          container.classList.remove("hidden");
          renderGrades();
        } else {
          container.classList.add("hidden");
          container.innerHTML = "";
          document.getElementById("submit-btn").disabled = true;
        }
      });

      function renderGrades() {
        const container = document.getElementById("grades-container");
        container.innerHTML = "";

        const targetMitra = selectedMitra.trim().toLowerCase();

        // Grades 3 to 8
        for (let grade = 3; grade <= 8; grade++) {
          const studentsInGrade = allStudents.filter((s) => {
            const dbMitra = (s.shiksha_mitra_name || "").trim().toLowerCase();
            const dbGrade = Number(s.grade);
            return dbMitra === targetMitra && dbGrade === grade;
          });

          const gradeDiv = document.createElement("div");
          gradeDiv.className =
            "border border-gray-200 rounded-lg p-4 bg-gray-50";

          let html = `<h3 class="text-lg font-semibold text-gray-700 mb-3">Grade ${grade} (${studentsInGrade.length} students)</h3>`;

          if (studentsInGrade.length === 0) {
            html += `<p class="text-sm text-gray-500 italic">No students found for this grade.</p>`;
          } else {
            html += `<ul class="space-y-2">`;
            studentsInGrade.forEach((student) => {
              html += `
              <li class="flex items-center justify-between bg-white p-3 rounded border border-gray-200 shadow-sm">
                <span class="text-gray-800 font-medium">${student.student_name}</span>
                <div class="flex items-center space-x-4">
                  <label class="flex items-center space-x-1 text-sm text-gray-600 cursor-pointer">
                    <input type="radio" name="student_${student.id}" value="Male" ${student.gender === "Male" ? "checked" : ""} onchange="checkFormValidity()" class="text-blue-600 focus:ring-blue-500">
                    <span>Male</span>
                  </label>
                  <label class="flex items-center space-x-1 text-sm text-gray-600 cursor-pointer">
                    <input type="radio" name="student_${student.id}" value="Female" ${student.gender === "Female" ? "checked" : ""} onchange="checkFormValidity()" class="text-blue-600 focus:ring-blue-500">
                    <span>Female</span>
                  </label>
                </div>
              </li>
            `;
            });
            html += `</ul>`;
          }

          gradeDiv.innerHTML = html;
          container.appendChild(gradeDiv);
        }
        checkFormValidity();
      }
      function checkFormValidity() {
        const checkedRadios = document.querySelectorAll(
          'input[type="radio"]:checked',
        );
        const submitBtn = document.getElementById("submit-btn");
        submitBtn.disabled = checkedRadios.length === 0;
      }

      document
        .getElementById("submit-btn")
        .addEventListener("click", async () => {
          const checkedRadios = document.querySelectorAll(
            'input[type="radio"]:checked',
          );
          const updates = [];

          checkedRadios.forEach((radio) => {
            const studentId = radio.name.replace("student_", "");
            const gender = radio.value;
            updates.push(
              supabaseClient
                .from("students")
                .update({ gender: gender })
                .eq("id", studentId),
            );
          });

          try {
            await Promise.all(updates);
            alert("Student genders updated successfully!");
            await fetchAllStudents();
          } catch (error) {
            console.error("Error updating database:", error);
            alert("Failed to update. Check console for details.");
          }
        });

      init();
    </script>
  </body>
</html>
